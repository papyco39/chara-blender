function pick(a){return a[Math.floor(Math.random()*a.length)]}
function chooseGender(){currentGender=gender==="random"?(Math.random()<.5?"male":"female"):gender}
function pool(){return DATA.common}
function hairString(v){return Array.isArray(v)?v.join(" × "):v}
function make(k){
  if(k==="髪型") return hairString(pick(DATA.common.髪型));
  if(k==="種族"||k==="役職"||k==="目"||k==="服装スタイル"||k==="小物"||k==="性格"||k==="ギャップ") return pick(DATA.common[k]);
  if(["MAIN","SUB1","SUB2","ACCENT"].includes(k)) return drawColor([]);
  return "未確定";
}
function drawColor(used){
  const usedHex=used.map(x=>Array.isArray(x)?x[1]:x);
  const choices=COLORS.filter(c=>!usedHex.includes(c[1]));

}

}
